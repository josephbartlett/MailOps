[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "mailops"
version = "0.2.1"
description = "Local-first email CLI for Proton Mail Bridge with search, triage, reviewed drafts, and audit export."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Joey Bartlett" },
]
keywords = ["email", "email-management", "email-triage", "protonmail", "protonmail-bridge", "cli", "sqlite", "local-first", "codex-skills"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Email",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "pydantic>=2.8,<3.0",
  "rich>=14.3.3,<16.0",
  "typer>=0.12.3,<1.0",
  "tomli>=2.2,<3; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10.0",
  "ruff>=0.12,<1.0",
  "build>=1.2,<2.0",
  "twine>=7.0,<8.0",
  "pip-audit>=2.9,<3.0",
]

[project.scripts]
mailops = "mailops.cli.main:main"

[project.urls]
Homepage = "https://github.com/josephbartlett/MailOps"
Repository = "https://github.com/josephbartlett/MailOps"
Documentation = "https://github.com/josephbartlett/MailOps/blob/main/docs/public-alpha.md"
"Issue Tracker" = "https://github.com/josephbartlett/MailOps/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mailops"]

[tool.hatch.build.targets.sdist]
include = [
  "/src", "/tests", "/scripts", "/skills", "/docs", "/examples", "/.github",
  "/AGENTS.md", "/README.md", "/CHANGELOG.md", "/CONTRIBUTING.md",
  "/SECURITY.md", "/CODE_OF_CONDUCT.md", "/LICENSE", "/pyproject.toml",
  "/.env.example", "/.gitignore", "/.gitattributes",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
