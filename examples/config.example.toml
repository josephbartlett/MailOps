# Copy to the selected MAILOPS_HOME/config/config.toml.
# Application settings come from environment variables; see .env.example.
# Only the Proton provider section is read from this file.

[providers.proton_bridge]
host = "127.0.0.1"
imap_port = 1143
smtp_port = 1025
imap_security = "plain"
username = "bridge-user"
# Supply MAILOPS_PROTON_PASSWORD at runtime; do not store passwords here.
account_email = "ops@example.com"

# Gmail runtime is unimplemented; there is no config flag that enables it.
