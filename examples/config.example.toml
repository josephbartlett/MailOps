[app]
environment = "development"
data_dir = ".mailops/data"
state_dir = ".mailops/state"
log_dir = ".mailops/logs"
redact_logs = true
model_provider = "openai"

[providers.proton_bridge]
enabled = true
host = "127.0.0.1"
imap_port = 1143
smtp_port = 1025
imap_security = "plain"
username = "bridge-user"
password = ""
account_email = "ops@example.com"

[providers.gmail_api]
enabled = false
